<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #4facfe, #00f2fe);
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      animation: fadeIn 1s ease-in;
    }

    .container {
      background: white;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 500px;
      animation: slideUp 0.8s ease-out;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .form-row label {
      flex: 1;
      font-weight: bold;
      margin-right: 1rem;
    }

    .form-row input[type="number"] {
      width: 100px;
      padding: 0.3rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-align: center;
    }

    .form-group input[type="checkbox"] {
      margin-right: 0.5rem;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
    }

    .btn {
      background: #4facfe;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #00c6ff;
    }

    .password-display {
      margin-top: 1.5rem;
      font-size: 1.2rem;
      word-break: break-all;
      color: #222;
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 10px;
    }

    .icon {
      margin-right: 0.4rem;
      color: #4facfe;
    }

    @keyframes fadeIn {
      from { opacity: 0 }
      to { opacity: 1 }
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0 }
      to { transform: translateY(0); opacity: 1 }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-lock icon"></i>Password Generator</h1>

    <div class="form-group">
      <div class="form-row">
        <label for="length">Password Length</label>
        <input type="number" id="length" value="12" min="4" max="64">
      </div>
    </div>

    <div class="form-group checkbox-group">
      <label><input type="checkbox" id="uppercase" checked> Include Uppercase Letters</label>
      <label><input type="checkbox" id="numbers" checked> Include Numbers</label>
      <label><input type="checkbox" id="special" checked> Include Special Characters</label>
    </div>

    <button class="btn" onclick="generatePassword()">
      <i class="fas fa-key icon"></i>Generate Password
    </button>

    <div id="result" class="password-display" style="display: none;"></div>
  </div>

  <script>
    async function generatePassword() {
      const length = document.getElementById('length').value;
      const includeUppercase = document.getElementById('uppercase').checked;
      const includeNumbers = document.getElementById('numbers').checked;
      const includeSpecial = document.getElementById('special').checked;

      const query = new URLSearchParams({
        length,
        include_uppercase: includeUppercase,
        include_numbers: includeNumbers,
        include_special: includeSpecial
      });

      try {
        const res = await fetch(`/generate-password?${query.toString()}`);
        if (!res.ok) throw new Error('Failed to generate password');

        const data = await res.json();
        const result = document.getElementById('result');
        result.textContent = data.password;
        result.style.display = 'block';
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
